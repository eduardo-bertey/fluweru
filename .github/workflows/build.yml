name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
          - target: windows
            os: windows-latest
            command: flutter build windows --release
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install NDK
        if: matrix.target == 'android'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" > /dev/null 2>&1 || true

      - name: Enable Windows desktop
        if: matrix.target == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Fetch Dart packages
        run: flutter pub get

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Generate Rust <-> Dart bindings
        run: flutter_rust_bridge_codegen generate

      - name: Build ${{ matrix.target }}
        run: ${{ matrix.command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr_app-${{ matrix.target }}
          path: |
            build/windows/x64/runner/Release/**/*
            build/linux/x64/release/bundle/**/*
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
