plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.pr_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.pr_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Rust (flutter_rust_bridge/cargokit) linkea contra libc++_shared.so
// (candle/tokenizers usan C++). Godot lo empaqueta siempre, pero Flutter no,
// asi que lo copiamos desde el NDK a jniLibs para que el APK incluya la lib
// y System.loadLibrary("rust_lib_pr_app") no falle al iniciar.
def ndkDir = android.ndkDirectory.getAsFile().get().toString()

android.sourceSets {
    main {
        jniLibs.srcDirs = ["src/main/jniLibs", "libcxx-prebuilt"]
    }
}

def copyLibCxx = tasks.register("copyLibCxx") {
    outputs.dir(layout.projectDirectory.dir("libcxx-prebuilt"))
    doLast {
        def abis = ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]
        abis.each { abi ->
            def from = new File(ndkDir, "sources/cxx-stl/llvm-libc++/libs/${abi}/libc++_shared.so")
            def to = new File(layout.projectDirectory.dir("libcxx-prebuilt"), "${abi}/libc++_shared.so")
            if (from.exists()) {
                to.parentFile.mkdirs()
                to.bytes = from.bytes
                logger.lifecycle("libc++_shared.so: copied ${abi}")
            } else {
                logger.warn("libc++_shared.so: no existe para ${abi} en ${from}")
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == "preBuild" || task.name == "mergeReleaseNativeLibs" || task.name == "mergeDebugNativeLibs") {
        task.dependsOn(copyLibCxx)
    }
}
