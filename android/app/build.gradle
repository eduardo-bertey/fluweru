plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.pr_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.pr_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Rust (flutter_rust_bridge/cargokit) linkea contra libc++_shared.so
// (candle/tokenizers usan C++). Godot lo empaqueta siempre, pero Flutter no,
// asi que agregamos la carpeta de libs C++ del NDK a jniLibs para que el APK
// incluya libc++_shared.so y System.loadLibrary("rust_lib_pr_app") no falle.
def ndkLibsDir = file("${android.sdkDirectory}/ndk/${android.ndkVersion}/sources/cxx-stl/llvm-libc++/libs")

android.sourceSets {
    main {
        jniLibs.srcDirs += [ndkLibsDir]
    }
}
